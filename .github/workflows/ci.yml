name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lint tools
        run: pip install ruff==0.4.9 black==24.4.2
      - name: Black
        run: black --check src/ api/ tests/ feature_store/
      - name: Ruff
        run: ruff check src/ api/ tests/ feature_store/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            pandas numpy scikit-learn plotly pydantic pydantic-settings \
            fastapi httpx structlog mlflow faker feast \
            xgboost lightgbm catboost optuna \
            tenacity slowapi pandera evidently shap imbalanced-learn \
            pytest pytest-cov
      - name: Run tests
        env:
          MLFLOW_TRACKING_URI: "http://localhost:5000"
          MLFLOW_OFFLINE: "true"
          SYNTHETIC_SEED: "42"
        run: |
          pytest tests/ \
            --ignore=tests/benchmarks \
            --cov=src \
            --cov=api \
            --cov-report=xml \
            --cov-report=term-missing \
            -v
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  benchmark:
    name: Benchmarks (main only)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install \
            pandas numpy scikit-learn pydantic pydantic-settings \
            structlog faker xgboost lightgbm catboost \
            pytest pytest-benchmark
      - name: Run benchmarks
        env:
          SYNTHETIC_SEED: "42"
        run: |
          pytest tests/benchmarks/ \
            --benchmark-only \
            --benchmark-json=reports/benchmark.json \
            --benchmark-sort=mean \
            -v
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: reports/benchmark.json

  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: churn-dashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
