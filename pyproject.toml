[tool.black]
line-length = 120
target-version = ["py311", "py312"]
skip-string-normalization = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # line too long (black handles this)
    "E402",   # module import not at top (needed for matplotlib.use)
    "F841",   # local variable assigned but never used
    "W291",   # trailing whitespace
    "E711",   # comparison to None
    "E712",   # comparison to True/False
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]   # redefined fixtures in conftest

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src", "api"]
omit = [
    "src/visualizations/*",
    "src/monitoring/*",
    "src/pipeline/*",
]
