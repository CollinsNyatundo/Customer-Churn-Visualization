[tool.black]
line-length = 120
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402", "F841", "W291", "E711", "E712"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src", "api"]
omit = [
    "src/visualizations/*",
    "src/monitoring/*",
    "src/pipeline/*",
    "src/telemetry/*",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_strict_optional = true
