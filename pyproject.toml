[tool.black]
line-length = 120
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402", "F841", "W291", "E711", "E712"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src", "api"]
# src/monitoring/* and src/pipeline/* were previously excluded here. That
# exclusion silently hid the exact modules where the most severe bugs were
# later found in code review (drift.py's broken API import, alerts.py's
# missing send() method causing AttributeError, flows.py issues) — a
# reported "92% coverage" number never actually covered these paths.
# Now that tests/test_drift.py, tests/test_alerts.py, and tests/test_pipeline.py
# provide real coverage, the exclusion is removed. src/visualizations/* and
# src/telemetry/* remain excluded and disclosed as a known gap in README.md —
# Dash callback testing and OTel tracing require different test strategies
# than the rest of this suite and are not yet covered.
omit = [
    "src/visualizations/*",
    "src/telemetry/*",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_strict_optional = true
